[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-streamable-crisis-kit"
version = "0.1.0"
description = "Reusable crisis arbitration and origin-guarded Streamable HTTP MCP tools for Alexa+ agents"
readme = "README.md"
authors = [{ name = "AegisMCP Contributors" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastmcp>=2.0.0",
    "starlette>=0.30.0",
]

[project.urls]
Homepage = "https://github.com/SomnathPal-max/mcp-streamable-crisis-kit"
Repository = "https://github.com/SomnathPal-max/mcp-streamable-crisis-kit"
